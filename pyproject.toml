[project]
name = "skepsis"
version = "0.1.0"
description = "Is your backtest result real, or overfit? Statistical diagnostics for backtest overfitting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Abhinay Mehta", email = "abhinay.mehta@gmail.com" }]
keywords = ["backtesting", "overfitting", "sharpe-ratio", "quant", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.18",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/abhinay/skepsis"
Documentation = "https://abhinay.github.io/skepsis"
Repository = "https://github.com/abhinay/skepsis"
Changelog = "https://github.com/abhinay/skepsis/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.0",
    "polars>=1.0",
]
demo = [
    "pandas>=2.0",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "playwright>=1.45",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skepsis"]

[tool.hatch.build.targets.sdist]
exclude = [".superpowers", "docs/superpowers", "site", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.mypy]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "skepsis.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*"]
ignore_missing_imports = true
